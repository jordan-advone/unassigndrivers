name: Scheduled driver unassign

# Started every 45 minutes by an external scheduler (cron-job.org) through the
# GitHub API, because GitHub's own schedule trigger is too unreliable.
# Manual runs from the Actions tab default to "check" (no changes).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test sign-in and show the schedule (no changes). run-if-due = normal run."
        type: choice
        options: [check, run-if-due]
        default: check

permissions:
  contents: read

concurrency:
  group: scheduled-unassign
  cancel-in-progress: false

jobs:
  unassign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run schedule
        run: node unassigndrivers-runner/scheduled-unassign.js
        env:
          GEOTAB_ACCOUNTS: ${{ secrets.GEOTAB_ACCOUNTS }}
          MODE: ${{ inputs.mode || 'run-if-due' }}
          RUN_ID: ${{ github.run_id }}
